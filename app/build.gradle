plugins {
    id "com.android.application"
}

android {
    namespace "com.stanly.walkietalkie"
    compileSdk 35

    defaultConfig {
        applicationId "com.stanly.walkietalkie"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}